<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="260" role="img" aria-labelledby="title desc">
  <title id="title">Andrey / Full-stack engineer</title>
  <desc id="desc">JavaScript and TypeScript. E-commerce, physical access control, and business systems and integrations.</desc>
  <style>
    text { font-family:Consolas,"Liberation Mono",monospace; fill:#1f2328; }
    .frame { width:calc(100% - 1px); fill:#f6f8fa; stroke:#d1d9e0; }
    .kicker { font-size:10px; letter-spacing:1.6px; fill:#59636e; }
    .name { font-size:48px; font-weight:600; letter-spacing:-3px; }
    .role { font-size:13px; }
    .rule { width:calc(100% - 56px); fill:#d1d9e0; }
    .number { font-size:10px; fill:#0969da; }
    .domain { font-size:11px; fill:#59636e; }
    .cursor { fill:#0969da; animation:blink 2s step-end infinite; }
    .mobile { display:none; }
    @keyframes blink { 0%,100% { opacity:1; } 50% { opacity:0; } }
    @media(prefers-reduced-motion:reduce) { .cursor { animation:none; } }
    @media(max-width:560px) {
      .kicker { font-size:9px; letter-spacing:1px; }
      .role { font-size:12px; }
      .desktop { display:none; }
      .mobile { display:block; }
    }
  </style>
  <rect class="frame" x="0.5" y="0.5" height="259" rx="6"/>
  <text class="kicker" x="28" y="32">SOFTWARE ENGINEERING</text>
  <text class="kicker desktop" x="100%" y="32" text-anchor="end" transform="translate(-28 0)">JAVASCRIPT / TYPESCRIPT</text>
  <text class="kicker mobile" x="28" y="51">JAVASCRIPT / TYPESCRIPT</text>
  <text class="name" x="28" y="107">anb24</text>
  <rect class="cursor" x="152" y="113" width="28" height="6" aria-hidden="true"/>
  <text class="role" x="28" y="144">Andrey / Full-stack engineer</text>
  <rect class="rule" x="28" y="169" height="1"/>
  <g class="desktop">
    <text class="number" x="28" y="195">01</text>
    <text class="domain" x="28" y="218">e-commerce</text>
    <text class="number" x="32%" y="195">02</text>
    <text class="domain" x="32%" y="218">physical access control</text>
    <text class="number" x="65%" y="195">03</text>
    <text class="domain" x="65%" y="218">business systems &amp;</text>
    <text class="domain" x="65%" y="235">integrations</text>
  </g>
  <g class="mobile">
    <text class="number" x="28" y="194">01</text><text class="domain" x="51" y="194">e-commerce</text>
    <text class="number" x="28" y="218">02</text><text class="domain" x="51" y="218">physical access control</text>
    <text class="number" x="28" y="242">03</text><text class="domain" x="51" y="242">business systems &amp; integrations</text>
  </g>
</svg>
